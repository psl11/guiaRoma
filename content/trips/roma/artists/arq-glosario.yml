name: Glosario · leer un edificio
dates: la chuleta para no perderte
epithet: «Diez palabras para entender cualquier iglesia, palacio o ruina que piséis.»
terms:
  - term: Arco vs dintel
    def: >-
      El _dintel_ es la viga recta horizontal (griego); el _arco_ de medio punto
      reparte el peso a los lados y cubre vanos mucho mayores (la gran arma
      romana).
  - term: Bóveda
    def: >-
      Un arco "estirado" que techa un espacio. De cañón (un túnel) o de crucería
      (dos bóvedas que se cruzan, típica del gótico).
  - term: Cúpula, tambor y óculo
    def: >-
      La _cúpula_ es una bóveda semiesférica; el _tambor_, el cilindro con
      ventanas que la eleva; el _óculo_, el ojo circular abierto en su cima (el
      del Panteón).
  - term: Los tres órdenes
    def: >-
      Se distinguen por el _capitel_: _dórico_ (liso y sobrio), _jónico_ (dos
      volutas en espiral), _corintio_ (hojas de acanto). Del más austero al más
      ornamentado.
  - term: Frontón (tímpano)
    def: >-
      El remate triangular sobre las columnas de un templo. El _tímpano_ es el
      espacio interior del triángulo, a menudo esculpido.
  - term: Columna vs pilastra
    def: >-
      La _columna_ es exenta y sostiene; la _pilastra_ es plana, pegada al muro,
      casi siempre decorativa.
  - term: Nave, ábside y crucero
    def: >-
      La _nave_ es el pasillo longitudinal; el _ábside_, el fondo semicircular
      tras el altar; el _crucero_, el brazo transversal que da forma de cruz.
  - term: Spolia
    def: >-
      Piezas (columnas, capiteles) _reutilizadas_ de edificios antiguos. Si en una
      iglesia las columnas no casan entre sí, son spolia.
  - term: Trampantojo (quadratura)
    def: >-
      Pintura que finge arquitectura y profundidad para engañar al ojo. El techo
      de Sant'Ignazio y su cúpula falsa son el ejemplo extremo.
  - term: Travertino
    def: >-
      La piedra caliza dorada con la que está construida media Roma (el Coliseo,
      las fuentes). Envejece a un tono cálido — por eso el mármol blanco del
      Vittoriano destaca tanto.
