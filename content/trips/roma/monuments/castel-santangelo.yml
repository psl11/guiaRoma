culture:
  - title: Referencias culturales y literarias
    text: ''
  - title: Tosca
    text: >-
      (Giacomo Puccini, 1900) — la ópera termina con la protagonista lanzándose
      desde el tejado del castillo tras cantar el aria «_E lucevan le stelle_».
      Uno de los finales operísticos más famosos del repertorio.
  - title: Ángeles y demonios
    text: >-
      (Dan Brown, 2000) — el castillo aparece como uno de los enclaves clave de
      la trama. La novela fue éxito mundial antes que _El código Da Vinci_.
  - title: I Segreti di Roma
    text: >-
      (Corrado Augias, 2005) — Augias traza la historia completa del edificio:
      el mausoleo de Adriano construido para ser la tumba más suntuosa del
      mundo, su conversión en fortaleza papal, los corredores secretos que
      conectan el castillo con el Vaticano (el _passetto_), y la leyenda del
      papa Gregorio Magno que en 590, durante una procesión de penitencia por la
      peste, vio al arcángel Miguel posarse sobre lo alto del mausoleo
      envainando la espada — señal del fin de la epidemia. De ahí el nombre.
  - title: Historias de Roma
    text: >-
      (Enric González, 2004) — González lo cita como ejemplo de la vocación
      romana de reutilizar: «en Roma nada se destruye y nada se construye de
      cero; todo se adapta, se tapa, se convierte en otra cosa».
