culture:
  - title: Referencias literarias
    text: ''
  - title: Historias de Roma
    text: >-
      (Enric González, 2004) — «En la Piazza de San Eustachio, lo suyo es tomar
      el mejor café del mundo. Lo preparan en el Caffè San Eustachio, tostando
      los granos con leña cada mañana... Ustedes dirán, quizá, que no es el
      mejor café del mundo. Vale. Pues aquí nos peleamos.» Sobre la iglesia de
      enfrente, González tiene la mejor prueba previa que existe: ¿por qué nadie
      quiere casarse ahí? La respuesta está arriba del pórtico: una gran cruz
      sobre una cabeza de ciervo con su cornamenta completa. «Evidentemente, a
      los romanos no les gusta salir de su boda bajo la sombra de los cuernos.»
      Sobre el café rival: «El que está en la esquina, con un agradable aspecto
      antiguo, pertenece, dicen, a la Camorra napolitana.»
