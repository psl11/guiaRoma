culture:
  - title: Referencias literarias
    text: ''
  - title: Historias de Roma
    text: >-
      (Enric González, 2004) — «Lo imprescindible está en un rincón, en una sala
      minúscula con una puerta cerrada al fondo que utilizan los propietarios,
      los Doria, para bajar de vez en cuando a contemplar su joya: el Inocencio
      X pintado por Velázquez. El artista español retrató al papa Inocencio tal
      como era, con toda su desconfianza y su crueldad dibujada en los ojos. Es
      un cuadro sobrecogedor.» González añade que Francis Bacon, obsesionado con
      ese retrato, «volcó sobre el rostro de Inocencio X un imaginario litro de
      ácido y lo deconstruyó en un retrato tan impresionante como el original».
