  label: La Grande Bellezza · escena inicial
  text: >-
    Minuto 4:30 de la película. Coro de mujeres cantando "I lie" mientras un
    turista japonés muere fulminado por la belleza de Roma vista desde aquí.
    Para reproducirla: ponte bajo el quinto arco, de espaldas a la fuente,
    mirando la ciudad.
