  - title: I Segreti di Roma
    text: >-
      (Corrado Augias, 2005) — Uno de los capítulos más cargados del libro.
      Augias recorre la historia del ghetto desde su creación por Pablo IV en
      1555 hasta la _razzia_ nazi del 16 de octubre de 1943, cuando más de 1.000
      judíos romanos fueron deportados a Auschwitz. Solo 16 volvieron. Describe
      cómo el Papa Pío XII no intervino públicamente, un silencio que sigue
      siendo el nudo moral más discutido de su papado. Las _stolpersteine_ en el
      suelo del barrio — los adoquines de bronce con los nombres de los
      deportados — son el mapa de esa mañana.
