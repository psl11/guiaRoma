culture:
  - title: Referencias literarias
    text: ''
  - title: Historias de Roma
    text: >-
      (Enric González, 2004) — González lo cita como «la atrocidad de la máquina
      de escribir blanca en Piazza Venezia, es decir, el horrible Monumento a la
      Patria perpetrado por los Saboya». Los romanos nunca le perdonaron que
      aplastara el perfil de la colina Capitolina con un blanco neoclásico sin
      pátina. Sus apodos — _la macchina da scrivere_, _la torta nuziale_, _la
      dentadura postiza_ — son exactamente del tipo de humor romano que González
      recoge en el libro.
