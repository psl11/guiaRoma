culture:
  - title: Referencias literarias
    text: ''
  - title: I Segreti di Roma
    text: >-
      (Corrado Augias, 2005) — El capítulo dedicado a Giordano Bruno es uno de
      los más detallados del libro. Augias reconstruye los siete años de proceso
      inquisitorial, los cargos exactos por los que Bruno fue condenado (no solo
      el heliocentrismo, sino su panteísmo radical: negaba la Trinidad, la
      Encarnación, la Virgen) y describe la mañana del 17 de febrero de 1600,
      cuando fue quemado vivo en esta misma plaza con la lengua sujeta para que
      no pudiera hablar. «Roma quemó a su mejor pensador y levantó una estatua
      en su honor. Así funciona esta ciudad con sus héroes.»
  - title: Historias de Roma
    text: >-
      (Enric González, 2004) — «Campo de' Fiori es la gran plaza laica de la
      vieja Roma: la única, creo, que carece de iglesia y de vírgenes en las
      esquinas.» González describe la plaza que no descansa nunca: el mercado de
      madrugada, las terrazas al mediodía, la juerga nocturna. Y Bruno: «Se le
      ató a una estaca y se le quemó vivo.» El cardenal Belarmino que le condenó
      fue canonizado en 1930. González remata: «Solo hubo que esperar setenta
      añitos más para que el papa Juan Pablo II pidiera perdón.» De noche,
      González quedaba en La Vineria, «por donde a una hora u otra pasaba todo
      el mundo — una vez vi a Francis Ford Coppola sentado en la terraza con
      unos amigos».
