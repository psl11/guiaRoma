sections:
  - heading: Qué es
    body: >-
      La colección de arte más intensa de Roma por metro cuadrado. En un _casino_
      nobiliario rodeado de jardines, lo que el cardenal **Scipione Borghese**
      reunió en el siglo XVII: **seis esculturas de Bernini** talladas en su
      juventud — entre ellas el _Apolo y Dafne_ y el _Rapto de Proserpina_ —,
      **seis Caravaggios**, la _Paolina_ de Canova, un Rafael, dos Tizianos.
      Probablemente lo mejor que vais a ver en el viaje fuera del Vaticano, y se
      visita por **turnos de dos horas con reserva obligatoria**.
  - heading: Historia
    body: >-
      **Scipione Borghese** (1577-1633) era el cardenal-sobrino del Papa Pablo V:
      el hombre que manejaba el poder y el dinero de la curia. Fue un coleccionista
      voraz y _sin escrúpulos_. Para hacerse con obras, confiscaba: al pintor
      Cavalier d'Arpino le requisó la colección entera (de ahí llegaron sus
      primeros Caravaggio); a Domenichino lo metió en la cárcel para quedarse con
      su _Caza de Diana_. Pero también fue el mecenas que descubrió a un Bernini
      veinteañero y le encargó las esculturas que **inventaron el Barroco**.


      El _casino_ (1613-1616), obra de Flaminio Ponzio y Giovanni Vasanzio, se
      construyó expresamente para exhibir la colección entre jardines. Se mantuvo
      en la familia Borghese hasta 1902, cuando el Estado italiano la compró
      íntegra para evitar su dispersión. Hoy es museo público — pero con aforo
      estricto: solo 360 personas cada dos horas, de ahí la reserva.
  - heading: Anécdotas
    body: >-
      El _Apolo y Dafne_ (1622-1625): Bernini tenía **24 años**. El mármol se
      convierte en hojas — los dedos de Dafne brotan en ramas de laurel, su piel
      se vuelve corteza, justo en el instante en que el dios la alcanza. En el
      _Rapto de Proserpina_, la mano de Plutón se hunde en el muslo de mármol de
      la diosa dejando marca: **el detalle más citado de toda la escultura
      occidental**, mármol que parece carne que cede.


      La **Paolina Borghese** de Canova (1805-1808): la hermana de Napoleón,
      casada con un Borghese, posó semidesnuda reclinada como Venus. Cuando le
      preguntaron escandalizados cómo había podido posar así, respondió con una
      frase legendaria: _«Había una estufa en la sala»_. De los Caravaggios, no os
      perdáis el _David con la cabeza de Goliat_: la cabeza decapitada que David
      sostiene es un **autorretrato del propio Caravaggio**, pintado mientras huía
      de Roma condenado a muerte por homicidio — un acto de contrición en forma de
      cabeza cortada.
  - heading: En qué fijarse
    body: |
      :detail-photo{src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/ab/Apollo_and_Daphne_%28Bernini%29_%28cropped%29.jpg/700px-Apollo_and_Daphne_%28Bernini%29_%28cropped%29.jpg" alt="Apolo y Dafne de Bernini: el mármol convertido en hojas de laurel en el instante de la metamorfosis." caption="_Apolo y Dafne_ de Bernini (1622-25). Dad la vuelta entera a la escultura: cada ángulo cuenta otro momento de la metamorfosis."}

      - Los **Bernini** de la planta baja: _Apolo y Dafne_, _Rapto de Proserpina_, _David_ (con el rostro mordiéndose el labio, autorretrato) y _Eneas y Anquises_. Rodeadlos: están pensados para verse en movimiento.
      - El detalle de la **mano de Plutón en el muslo** de Proserpina. Acercaos.
      - La **Paolina** de Canova: la manzana en la mano (Venus vencedora), el colchón de mármol que parece hundirse.
      - Los **seis Caravaggios** (planta superior): _David con la cabeza de Goliat_, _Niño con cesto de frutas_, _Baco enfermo_, _San Jerónimo_, _Madonna dei Palafrenieri_.
      - _Amor sacro y amor profano_ de **Tiziano** (sala XX): uno de los cuadros más enigmáticos del Renacimiento.
      - Los **techos al fresco** y la propia arquitectura del casino.
      - **Dos horas pasan volando**: si vais justos, priorizad Bernini (abajo) y Caravaggio (arriba). Mochilas a la consigna, es obligatorio.
  - heading: ¿Sin entradas? Cómo conseguirlas y Plan B
    body: |
      **Para este viaje:** no hubo turnos libres para las fechas (se agotaron con semanas de antelación). El plan del martes asume que _no_ se entra — ver el Plan B del día V en el timeline. Aun así, último intento por si se libera algo:

      - **Cancelaciones de VivaTicket** (el sistema oficial): entran nuevas plazas cada mañana al **abrir el sistema** (~9:00 h). Vale la pena mirar durante 3-4 días seguidos a esa hora exacta.
      - **Tiqets / GetYourGuide / Musement**: los revendedores oficiales a veces tienen hueco cuando VivaTicket indica sold-out. Cobran ~€5-8 de recargo, pero es legítimo.
      - **En persona en la taquilla**: algunos turnos (suele ser el de las 9:00 o el último de la tarde) se reservan como _walk-in_ del día. Llegar 30 min antes de la apertura del museo y preguntar.
      - **Llamar** directamente: +39 06 8413979. A veces gestionan cancela­ciones por teléfono.

      **Plan B si no conseguís entrada:**

      - **Galleria Nazionale d'Arte Moderna (GNAM)**: dentro de los propios jardines de Villa Borghese, a 5 min andando del casino. La mayor colección de arte moderno italiano — Modigliani, De Chirico, Balla, Canova, Klimt. Sin reserva, sin aforo. Entra todo el mundo. Cierra lunes.
      - **Museo Etrusco di Villa Giulia**: al borde del parque, a 15 min. La mejor colección etrusca del mundo — la escultura del _Sarcófago de los Esposos_ sola justifica la visita. Sin reserva.
      - **El parque + Pincio con tiempo de sobra**: si cae el plan del museo, tened la mañana entera para el laghetto, el reloj de agua, los pinos y el mirador — sin prisa, con granita di caffè de Tazza d'Oro en el bolsillo.
