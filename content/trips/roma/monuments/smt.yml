culture:
  - title: Referencias literarias
    text: ''
  - title: Historias de Roma
    text: >-
      (Enric González, 2004) — «Tal vez hayan visto en Londres o en Berlín los
      restos fosilizados de un archaeopterix, el pequeño saurio jurásico alado y
      con plumas, considerado uno de los eslabones entre los dinosaurios y su
      resultado evolutivo, las aves. Algo así es, por ejemplo, la iglesia de
      Santa María en el Trastevere: un eslabón entre el Imperio romano y su
      resultado evolutivo, el imperio de la Iglesia católica.»
