culture:
  - title: Referencias literarias
    text: ''
  - title: Historias de Roma
    text: >-
      (Enric González, 2004) — «No entren en este templo bajo el efecto de una
      droga: podrían pasar un mal rato porque del techo pintado por Andrea Pozzo
      brotan manos, rostros y rayos divinos. ‹Brotan› literalmente, acercándose
      al observador. Ni la aparente profundidad del techo ni la falsa cúpula
      pueden describirse correctamente: hay que estar ahí, bajo el invento de
      Pozzo, para comprender de qué hablamos.»
