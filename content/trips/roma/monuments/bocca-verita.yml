culture:
  - title: Referencias culturales y literarias
    text: ''
  - title: Vacaciones en Roma
    text: >-
      (William Wyler, 1953) — la escena más famosa: Gregory Peck mete la mano en
      la Bocca y simula que se la arranca para asustar a Audrey Hepburn. La
      reacción de Hepburn es genuina — Peck no la avisó.
  - title: I Segreti di Roma
    text: >-
      (Corrado Augias, 2005) — Augias desmonta el mito: la Bocca no es ninguna
      trampa para perjuros sino una simple tapa de alcantarilla romana del siglo
      IV a.C., probablemente del desagüe del Foro Boario. Su identidad exacta
      sigue en discusión. Augias lo usa como ejemplo de la tendencia romana a
      fabricar leyendas sobre objetos ordinarios: «Roma convierte en sagrado lo
      que toca».
