culture:
  - title: Referencias literarias
    text: ''
  - title: Historias de Roma
    text: >-
      (Enric González, 2004) — Tras defender a capa y espada a Sant'Eustachio
      («Aquí nos peleamos»), González concede: «Si les quedaran ganas, verán en
      la plaza una cafetería llamada La Tazza d'Oro. Es la única que rivaliza con
      la cafetería San Eustachio. Para mí no hay color, pero en este caso tolero
      la heterodoxia.» De boca de González, esa "heterodoxia" es casi un Premio
      Nobel.
