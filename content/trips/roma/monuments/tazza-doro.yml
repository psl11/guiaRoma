sections:
  - heading: Qué es
    body: >-
      El otro gran templo del café romano, a 50 metros del Pantheon, fundado en
      1944. Si Sant'Eustachio es la elegancia barroca del espresso, Tazza d'Oro
      es la **tecnología cafetera** al máximo nivel. Su mezcla "Regina dei
      Caffè" — coronada por una corona dorada en el logo — es referencia entre
      los romanos exigentes que se quejan del declive cualitativo de la mayoría
      de bares. Imprescindible en cualquier paseo serio por el centro storico.
  - heading: Historia
    body: >-
      Lo fundó la familia **Lemme** en 1944, todavía durante la Segunda Guerra
      Mundial — apenas semanas después de la liberación de Roma por los Aliados,
      en junio de 1944. Inicialmente era una torrefactora artesanal en una época
      en que el café era racionado y se mezclaba con sucedáneos (achicoria,
      cebada tostada, garbanzos molidos). Cuando volvió la abundancia, la familia
      Lemme se especializó en mezclas de granos importados de Brasil, Costa Rica,
      Etiopía y Yemen. Su _Miscela Regina_ ("mezcla reina") se convirtió en marca
      registrada y referencia.


      El local es pequeño: una barra alargada de madera, máquinas de café de
      bronce pulido, sacos de café arábica abiertos detrás del mostrador. El olor
      al entrar es intenso — café tostado en su torrefactora propia (todavía en
      activo, en una calle cercana). El sistema es el de bar romano clásico:
      pagas primero en la caja (_cassa_), recibes un recibo (_scontrino_), pasas
      al mostrador y entregas el recibo al barista junto con tu pedido. Las
      propinas son opcionales pero apreciadas (€0,10-0,20 por café). En 2025-2026
      mantienen los precios bajos: espresso €1,30 en barra.


      La **granita di caffè con panna** es lo otro emblemático. Hielo picado de
      café concentrado servido en vaso, con nata batida arriba y debajo (la nata
      "abraza" el café por ambos lados). Es la mejor granita de café de Roma.
      €4,50. En junio con 32°C es probablemente la cosa más placentera que vais a
      tomar en el viaje.
  - heading: Anécdotas
    body: |
      La rivalidad histórica con **Sant'Eustachio** (a 200 metros) es la versión romana del clásico debate del XX entre dos referentes. Los romanos se posicionan a un lado u otro casi como si fuera una elección política: _"Sono di Tazza"_ / _"Sono di Sant'Eustachio"_. No hay tercera opción. Las diferencias técnicas son sutiles pero reales:

      :detail-photo{src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8a/Roma_-_Cappuccini_al_caff%C3%A8_Tazza_d%27Oro.jpg/960px-Roma_-_Cappuccini_al_caff%C3%A8_Tazza_d%27Oro.jpg" alt="La Casa del Caffè Tazza d'Oro frente al Pantheon, Roma" caption="Tazza d'Oro está a 50 metros del Pantheon, en esta misma plaza. González: «La única que rivaliza con Sant'Eustachio. Para mí no hay color, pero tolero la heterodoxia.» El sistema: cassa → scontrino → barra. Granita di caffè con doppia panna en junio."}

      - **Tazza d'Oro**: café más fuerte, con más cuerpo, mezcla más oscura, sin azúcar añadido en barra. Para puristas.
      - **Sant'Eustachio**: café más cremoso, con el truco de la espuma sobre el espresso, azucarado por defecto. Para hedonistas.

      Recomendación honesta: **probad ambos en el viaje**. En este plan, **Tazza d'Oro** cae el lunes por la mañana (junto al Pantheon, tras la Casanatense) y **Sant'Eustachio** el viernes por la noche. Comparad en directo: cada uno tendrá su preferido al final.

      **¿Cuál llevar a casa?** Para llevar de souvenir, **Sant'Eustachio** es la apuesta clásica: la _lattina_ azul es el recuerdo de café italiano más reconocible y el mejor regalo, con esa crema tan suya. Si en casa preferís un espresso **más fuerte, oscuro y sin azúcar añadido**, tirad por la _Miscela Regina_ de **Tazza d'Oro** (algo más barata). Si solo compráis una, Sant'Eustachio. En ambas, decid si lo queréis _in grani_ (grano) o _macinato_ — y si usáis cafetera italiana, pedidlo _«per moka»_.

      El **edificio** donde está Tazza d'Oro es discreto pero histórico: en este mismo punto, en el siglo XVIII, había una cafetería más antigua llamada _Caffè dei Pellegrini_. Continuidad cafetera en este sitio: aproximadamente 280 años. El Pantheon a 30 metros lleva 1.900 años. Roma no está hecha para los efímeros.
  - heading: En qué fijarse
    body: |
      - El **logo de la corona dorada**: emblema de la _Regina dei Caffè_. Llevadlo grabado mentalmente; lo vais a ver en mil paquetes de café por toda Italia.
      - Las **máquinas de bronce pulido**: de los años 60-70, mantenidas a perfección. Romanas hasta el último tornillo.
      - Los **sacos de café abiertos** detrás del mostrador: granos de arábica de orígenes diferentes, mezclados según la receta.
      - Pedid el **caffè** (espresso normal) en barra: €1,30. Sin azúcar, o pídelo _amaro_ explícitamente. Bébelo de un solo sorbo.
      - Pedid la **granita di caffè con panna**: €4,50. Imprescindible en junio. El barista os preguntará si lo queréis "_doppia panna_" (doble crema, arriba y abajo). Decid _sì_.
      - Comprad un **paquete de café molido** para llevar (€8-12, según mezcla). Es un excelente regalo de Roma o para vosotros mismos. Pedid la "_Miscela Regina_".
      - El **flujo del bar**: caja → scontrino → barra. No te saltes la caja, te miran feo.
      - De pie, siempre. Si os sentáis a una mesa, doblan el precio.
