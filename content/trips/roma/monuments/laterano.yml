culture:
  - title: Referencias literarias
    text: ''
  - title: I Segreti di Roma
    text: >-
      (Corrado Augias, 2005) — Augias subraya la paradoja que más descoloca a
      los visitantes: «la catedral más importante del mundo no es la de Roma,
      sino que es la de Roma, y casi nadie lo sabe». Dedica un capítulo a la
      historia del Laterano como sede del poder pontificio durante mil años, a
      los Pactos de 1929 firmados en este palacio, y a por qué la inauguración de
      la nueva basílica de San Pedro en el Vaticano fue, de algún modo, la firma
      del declive político de los Papas: cuando se trasladaron allí, dejaron de
      ser los obispos de Roma y se convirtieron en monarcas universales.
