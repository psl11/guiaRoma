culture:
  - title: Referencias culturales
    text: ''
  - title: La dolce vita
    text: >-
      (Federico Fellini, 1960) — la escena más famosa del cine italiano: Anita
      Ekberg bañándose en la fuente con Marcello Mastroianni. Rodada en marzo
      con agua a 4°C.
  - title: Tres monedas en la fuente
    text: >-
      (Jean Negulesco, 1954) — la película que popularizó internacionalmente la
      tradición de la moneda.
  - title: I Segreti di Roma
    text: >-
      (Corrado Augias, 2005) — Augias recorre la historia del Acqua Vergine, el
      acueducto de Agripa del año 19 a.C. que aún hoy abastece esta fuente: el
      nombre «Vergine» viene de la leyenda de la jovencita que, según Frontino,
      mostró a los ingenieros romanos el manantial en la Campagna. El agua lleva
      viniendo del mismo sitio desde hace 2.000 años.
  - title: Historias de Roma
    text: >-
      (Enric González, 2004) — González pasa por la fuente de noche, cuando ya
      no hay turistas: «Roma mantiene una relación estrictamente pasiva con el
      tiempo» — la Fontana di Trevi sigue abastecida por el Acqua Vergine, el
      mismo acueducto de Agripa del año 19 a.C. La fontana de noche, sola, es
      exactamente la imagen de esa frase.
