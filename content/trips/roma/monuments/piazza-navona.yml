culture:
  - title: Referencias literarias
    text: ''
  - title: I Segreti di Roma
    text: >-
      (Corrado Augias, 2005) — Augias recorre la historia del _Stadio di
      Domiziano_ que da forma a la plaza, y el descubrimiento en el siglo XIX de
      que el perímetro ovalado de las casas trazaba exactamente la pista de
      carreras original. Tiene también un pasaje divertido sobre la rivalidad
      entre Bernini y Borromini: comparten plaza, trabajan para el mismo papa, y
      Bernini hizo que la figura del Río de la Plata alzara el brazo mirando
      hacia la fachada de su rival «como horrorizado». Borromini murió antes de
      poder responder.
  - title: Historias de Roma
    text: >-
      (Enric González, 2004) — González la nombra simplemente como el «estadio
      de Domiciano», porque eso es lo que es. Esa es exactamente la actitud
      correcta ante Roma: ver debajo de lo que ves.
