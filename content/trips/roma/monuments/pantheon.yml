culture:
  - title: Referencias literarias
    text: ''
  - title: I Segreti di Roma
    text: >-
      (Corrado Augias, 2005) — Augias dedica un capítulo a la tumba de Rafael en
      el Pantheon y a la petición que hizo en su testamento: ser enterrado allí
      con su amante, la _Fornarina_. Solo la primera parte se cumplió. También
      recorre la historia del edificio desde Agripa hasta Hadrian, deteniéndose
      en el misterio estructural de la cúpula: el mayor domo de hormigón sin
      armar del mundo, todavía sin rival.
  - title: Historias de Roma
    text: >-
      (Enric González, 2004) — González pone el dato en perspectiva: «Solo en
      1958 los técnicos modernos consiguieron levantar una cúpula de hormigón
      más grande que la del Panteón. Hasta entonces no había sido posible
      reproducir tal maravilla.» Y sobre Adriano: «prefirió dedicarlo a Agripa»
      — la inscripción monumental de la fachada es publicidad de un edificio
      anterior que ya no existe. La modestia de un genio, o su sentido del
      humor.
