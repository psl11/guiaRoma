culture:
  - title: Referencias culturales
    text: ''
  - title: Ángeles y Demonios
    text: >-
      (Dan Brown / Ron Howard) — la iglesia aparece en la novela y la película
      como una de las cuatro paradas del «Camino de la Iluminación». Excesivo
      como siempre, pero la capilla es exactamente tan teatral como Brown la
      describe.
  - title: I Segreti di Roma
    text: >-
      (Corrado Augias, 2005) — Augias dedica un pasaje a la ambigüedad deliberada
      de Bernini: «creó algo que parece sagrado y parece profano, y esa es
      exactamente su grandeza».
