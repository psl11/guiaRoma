    items:
      - level: ok
        text: '⏱ **2h 30min** · hasta ~17:30 · Coliseo con Arena + Foro Romano + Palatino'
      - level: plain
        text: '🚶 hasta el bar del partido: **3-12 min**'
  - kind: stop
