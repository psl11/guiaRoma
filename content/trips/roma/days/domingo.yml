    footnote: >-
      Estas dos son por si os apetece la cucina ebraica al pasar; pero hoy **la
      comida está pensada más cerca del Coliseo** (ver más abajo, ~13:30) para
      llegar al tour de las 15:00. Si coméis aquí, contad 15-20 min hasta el punto
      de encuentro. Fichas en [Gastronomía](#gastronomia).
