slug: domingo
trip: roma
order: 3
roman: III
eyebrow: domenica · 21 giugno
title: Aventino · Ghetto · Roma Antigua
subtitle: >-
  El día más físico. Aventino y Ghetto por la mañana, Coliseo con Arena por la
  tarde, España en el Mundial y el concierto de Einaudi como broche.
stats:
  - variant: walk
    text: '**~6,5 km** a pie'
  - variant: metro
    text: '**Metro B** Termini→Circo Massimo (mañana)'
  - variant: ticket
    text: '**Coliseo guiado · 15:00** · Arena + Foro + Palatino (2h 30min)'
  - variant: taxi
    text: '**Taxi al Auditorium** · concierto Einaudi 21:00 (~€20)'
light:
  title: 🦶 Versión ligera · domingo (el día más exigente)
  items:
    - kind: care
      text: >-
        **El día clave para el tobillo:** el tour incluye Foro y Palatino, de
        terreno irregular y con cuestas. **Guardad las piernas para esto** y
        descansad por la mañana.
    - kind: see
      text: >-
        **Imprescindibles:** comida en Ristoro Della Salute (13:30, junto al
        Coliseo), tour Coliseo + Arena (15:00, reservado), España en el pub
        (18:00, sentados) y concierto Einaudi (21:00, sentados).
    - kind: skip
      text: >-
        **Saltar la mañana de andar:** el Aventino ([Giardino degli
        Aranci](#giardino-aranci) y [Buco della Serratura](#buco-serratura)
        suben colina) y reducir el Ghetto. Mejor llegar fresco al tour.
    - kind: move
      text: >-
        **Cómo moverse:** taxi directo a la comida (Ristoro, a pie de Coliseo) y
        taxi del pub al Auditorium. Nada de patear el centro antes del tour.
    - kind: care
      text: >-
        **En el tour, avisad al guía del esguince:** podéis hacer Coliseo + Arena
        y aflojar en el Foro/Palatino (la parte con subida) o ir a vuestro aire.
        Calzado de apoyo.
    - kind: rest
      text: >-
        **Descanso:** comida en Ristoro antes del tour; el partido y el concierto
        son sentados.
