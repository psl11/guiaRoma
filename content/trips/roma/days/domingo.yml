  - kind: meta
    items:
      - level: ok
        text: >-
          ⏱ **~2 h** · partido + **cena en el propio pub** · al pitido final,
          taxi al Auditorium para el concierto
  - kind: food
    pace: all
    header: ⚽ Ver a España cerca del Coliseo · sports bars
    entries:
      - href: 'https://www.google.com/maps/search/?api=1&query=The%20Shamrock%20Irish%20Pub%20Via%20del%20Colosseo%20Roma'
        name: The Shamrock
        time: '🚶 3 min'
        desc: >-
          Pub irlandés en Via del Colosseo, literalmente al lado · varias
          pantallas · el más cercano y futbolero · birra ~€6
      - href: 'https://www.google.com/maps/search/?api=1&query=The%20Scholars%20Lounge%20Roma'
        name: The Scholars Lounge
        time: '🚶 12 min'
        desc: >-
          Cerca de Piazza Venezia · el pub deportivo más grande de Roma ·
          pantallas enormes y ambientazo en partidos · birra ~€7
      - href: 'https://www.google.com/maps/search/?api=1&query=The%20Fiddler%27s%20Elbow%20Roma'
        name: The Fiddler's Elbow
        time: '🚶 12 min'
        desc: >-
          El pub irlandés más antiguo de Roma, junto a Monti / Santa Maria
          Maggiore · clásico para fútbol · birra ~€6
    footnote: >-
      En partido de España estos pubs se llenan: llegad **20-30 min antes** para
      coger sitio. The Shamrock es el más cercano al Coliseo; The Scholars Lounge,
      el de más ambiente. **Cenáis ahí mismo durante el partido** (todos sirven
      comida) y al pitido final salís hacia el concierto.
  - kind: transport
    pace: all
    variant: taxi
    header: Pub (Coliseo) → Auditorium Parco della Musica · ~7 km
    modes:
