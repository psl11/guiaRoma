    title: Desayuno + check-out · maletas en consigna
    disabled: true
    note: 'El vuelo es de noche: dejad las maletas en el hotel y salid ligeros.'
  - kind: meta
    items:
      - level: ok
        text: '⏱ **45 min** · desayuno + check-out + dejar maletas en consigna'
