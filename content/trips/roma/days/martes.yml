  - kind: transport
    pace: all
    variant: train
    header: Termini → Fiumicino (FCO)
    modes:
      - icon: 🚆
        recommended: true
        desc: >-
          **Leonardo Express** · directo sin paradas · sale cada 15 min · binari
          23/24 · salid hacia las 18:15 para estar en FCO sobre las 19:00
        tag: recomendado
        meta: '⏱ **32 min**<br>💶 **€14 p.p. · €42 total**'
      - icon: 🚕
        desc: '**Taxi** · tarifa fija a FCO desde dentro del Raccordo Anulare'
        meta: '⏱ **45-60 min · según tráfico**<br>💶 **€55 fijo · €18 p.p.**'
    footnote: >-
      Comprad el billete en la app Trenitalia/Omio o en las máquinas amarillas.
      Con vuelo a las **21:50**, salir de Termini hacia las 18:15 deja FCO sobre
      las 19:00 y ≈2h45 antes del vuelo — margen de sobra para un extracomunitario.
      Si vais cómodos, podéis estirar hasta salir a las 18:30.
