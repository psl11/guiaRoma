slug: martes
trip: roma
order: 5
roman: V
eyebrow: martedì · 23 giugno
title: Villa Borghese y despedida
subtitle: >-
  El último día. Sin la Galleria Borghese, el arte lo pone Palazzo Barberini
  (Caravaggio y Rafael); luego, el Bernini del Éxtasis de Santa Teresa y un
  cierre sereno junto al hotel antes del vuelo nocturno.
stats:
  - variant: walk
    text: '**~2 km** a pie · día llano e interior'
  - variant: ticket
    text: >-
      **Palazzo Barberini** · ~€12 · sustituye a la Galleria Borghese (sin
      reserva)
  - variant: train
    text: '**Leonardo Express** Termini→FCO (32 min, €14)'
light:
  title: 🦶 Versión ligera · martes (despedida)
  items:
    - kind: see
      text: >-
        **Imprescindibles:** [Palazzo Barberini](#palazzo-barberini) (Caravaggio
        y Rafael, interior), comida en [La Vecchia Roma](#g-vecchia-roma) (13:00),
        el [Éxtasis de Santa Teresa](#santa-teresa) de Bernini y [Santa Maria
        Maggiore](#smm).
    - kind: move
      text: >-
        **Cómo moverse:** metro/taxi al museo (Barberini, 2 paradas) y taxi de
        vuelta a Monti. La tarde (Santa Teresa, SMM, degli Angeli) está pegada al
        hotel y es llana. Casi todo el día en interior.
    - kind: skip
      text: >-
        **Saltar hoy:** la [Cripta dei Cappuccini](#cappuccini) si cansa (está al
        lado del museo, así que es opcional sin desviarse).
    - kind: care
      text: >-
        **Ojo:** dejad margen para recoger maletas sin prisas antes del tren de
        las 18:15.
    - kind: rest
      text: >-
        **Descanso:** comida en La Vecchia Roma; todo lo de la tarde a pocos
        minutos del hotel.
timeline:
