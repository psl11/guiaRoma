      Pietro da Cortona. Interior y con bancos.
  - kind: meta
    items:
      - level: ok
        text: >-
          ⏱ **90 min** · la _Judith_ de Caravaggio, la _Fornarina_ de Rafael, el
          _Triunfo_ de Cortona y la escalera helicoidal de Borromini · abre 10:00,
          cierra lunes
      - level: plain
        text: '🚶 hasta Cappuccini: **5 min**'
