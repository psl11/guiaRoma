eyebrow: venerdì · 19 giugno
title: Centro Storico nocturno
subtitle: El bautismo. Roma iluminada en sus mejores escenarios.
stats:
  - variant: walk
    text: '**~3,5 km** a pie'
  - variant: train
    text: '**Leonardo Express** FCO→Termini (32 min, €14) · hotel a 4 min'
  - variant: taxi
    text: '**2 trayectos** taxi · hotel ↔ centro (~€10 cada uno)'
light:
  title: 🦶 Versión ligera · viernes
  items:
    - kind: see
      text: >-
        **Imprescindibles:** Fontana di Trevi, Pantheon (exterior), Piazza
        Navona y cena en [Osteria da Fortunata](#g-fortunata) (junto a Campo de'
        Fiori, 22:30). Todo llano y muy junto: ~1 km en total.
    - kind: move
      text: >-
        **Cómo moverse:** taxi del hotel directo a Trevi y taxi de vuelta desde
        Campo de' Fiori. Entre paradas, calles cortas y planas (4-5 min cada
        tramo).
    - kind: skip
      text: >-
        **Saltar hoy:** Galleria Sciarra (desvío con poco margen) y, si cansa,
        Sant'Ignazio.
    - kind: rest
      text: >-
        **Descanso:** sentaos pronto a cenar en Campo de' Fiori; un caffè en
        Navona por el camino.
timeline:
  - kind: stop
    pace: all
    time: '~17:00'
    title: Llegada · aeropuerto → hotel
    disabled: true
    note: >-
      Del aeropuerto a Termini; el hotel está a 4 min andando de la estación.
      Ajustad según la hora real de aterrizaje.
  - kind: transport
    pace: all
    variant: taxi
    header: Fiumicino (FCO) → Roma Termini · ~32 km
    modes:
      - icon: 🚕
        recommended: true
        desc: >-
          **Taxi** · tarifa fija oficial FCO → centro · puerta del hotel, sin
          arrastrar maletas por Termini · siendo 3, sale a cuenta
        tag: recomendado a la llegada
        meta: '⏱ **45-55 min**<br>💶 **€55 fijo · €18 p.p.**'
      - icon: 🚆
        desc: >-
          **Leonardo Express** · directo sin paradas · sale cada 15 min · el
          hotel a 4 min de Termini · más barato e inmune al tráfico
        meta: '⏱ **32 min**<br>💶 **€14 p.p. · €42 total**'
    footnote: >-
      Para **3 con maletas y al final del día de viaje**, el taxi (€55 fijo, ~€18
      p.p.) compensa los ~€13 de diferencia: os deja en la puerta. El tren gana
      si hay atasco o si vais ligeros. Taxi: solo blancos oficiales de la parada,
      confirmad _"tariffa fissa per il centro"_ antes de subir (€55 hasta 4 pax,
      maletas incluidas; tarifa vigente desde 2024, confirmad el cartel). Tren:
      billete en la app **Trenitalia**/**Omio** o en la máquina — **sin reserva
      previa**, precio fijo y sin asiento. _Si aterrizáis en Ciampino (CIA):_ no
      hay tren — bus Terravision/SIT (~€6, 40 min) o taxi fijo €40.
  - kind: stop
    pace: all
