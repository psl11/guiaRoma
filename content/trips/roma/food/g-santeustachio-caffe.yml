name: Sant'Eustachio Il Caffè
address: Piazza di Sant'Eustachio 82 · Pantheon
desc: >-
  Ya está en vuestro itinerario del sábado, pero merece su ficha gastronómica.
  Desde 1938. Uno de los grandes debates romanos: ¿Tazza d'Oro o Sant'Eustachio?
  La diferencia: aquí añaden azúcar durante la extracción (el «gran caffè» con
  crema montada y azúcar embebido). Si no lo quieres dulce, pide «amaro».
plato: >-
  **Plato estrella:** gran caffè (el especial con crema azucarada) · granita di
  caffè con panna en verano.
