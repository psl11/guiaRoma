address: Vicolo del Bologna 45 · Trastevere
desc: >-
  Desde 1995. «Ni romana ni napolitana» según sus propios dueños — masa de 48h
  de fermentación con un carácter propio. Callejuela de Trastevere, ambiente
  ruidoso y honesto. No acepta reservas: llegar antes de las 20h o esperar en la
  calle.
plato: >-
  **Plato estrella:** no hay una favorita canónica — la masa en sí es el
  argumento. Goop la llama «una de nuestras favoritas de la ciudad».
