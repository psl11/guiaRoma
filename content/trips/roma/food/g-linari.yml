name: Pasticceria Linari
address: Via Nicola Zabaglia 9 · Testaccio
desc: >-
  La pasticcería del barrio obrero de Testaccio desde 1971. Los hermanos Linari
  la llevan en familia. Famosa por los maritozzi, cornetti y el «Monte
  Testaccio» — una bomba de masa de maritozzo rellena de chantilly de ricotta.
  Para quienes se acerquen al Checchino o Felice a Testaccio.
plato: >-
  **Plato estrella:** Monte Testaccio (relleno de chantilly de ricotta) +
  maritozzi + pizzette rosse de la mañana.
footer: Cerrado martes · €2-5 · Testaccio (fuera del itinerario principal)
