name: Pompi — Il Regno del Tiramisù
address: Via della Croce 82 · Spagna
desc: >-
  Desde 1960. La sucursal de Spagna está a 2 minutos de la escalinata. Pompis
  fue el primero en hacer tiramisù en variantes (fresa, pistacho, banana,
  nocciola, frutti di bosco) manteniendo producción completamente artesanal.
  Colas constantes pero rápidas.
plato: >-
  **Plato estrella:** tiramisù clásico + tiramisù al pistacho. El de fresa en
  junio es de temporada. Formato individual (€5-7).
