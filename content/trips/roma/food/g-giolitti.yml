name: Giolitti
address: Via Uffici del Vicario 40 · Pantheon
desc: >-
  Fundada en 1890 como lechería proveedora de la Casa Real italiana. La
  gelatería más antigua de Roma. En _Vacaciones en Roma_ (1953), Audrey Hepburn
  come un cono de Giolitti en los escalones de la Scalinata. Menos creativa que
  las nuevas, pero impecable en los clásicos.
plato: >-
  **Plato estrella:** pistacho, nocciola, caffè. La panna (nata montada) encima
  es gratuita y vale pedirla.
