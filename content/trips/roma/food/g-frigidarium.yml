desc: >-
  Una de las gelaterie más alabadas del centro histórico, a menos de 10 minutos
  de Piazza Navona. El truco: te sumergen el cono en chocolate fundido al
  momento. Cola habitual incluso en invierno. Precio muy razonable.
plato: >-
  **Plato estrella:** stracciatella en cono sumergido en chocolate negro. El
  bacio (avellana + chocolate) también es notable.
