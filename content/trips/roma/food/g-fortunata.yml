desc: >-
  Desde 1921. La pasta se hace a mano en la ventana de la calle — las señoras
  amasando y cortando son el espectáculo antes de entrar. Fila constante, es el
  destino Instagram de pasta romana, pero la comida justifica la espera.
plato: >-
  **Plato estrella:** gnocchi + carbonara (muy alabada). Ojo: el show de la
  pasta en la ventana es lo más recordable.
