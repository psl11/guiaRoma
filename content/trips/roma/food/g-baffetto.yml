name: Pizzeria da Baffetto
address: Via del Governo Vecchio 114 · Navona
desc: >-
  Desde 1964. La pizza romana de masa fina y crujiente más célebre del centro,
  en una esquina de Via del Governo Vecchio a pocos pasos de Piazza Navona.
  Horno de leña, camareros veloces, mesas pegadas y cola en la calle. No
  reserva: se espera turno (suele ir rápido). Una institución.
plato: >-
  **Plato estrella:** pizza Baffetto (tomate, mozzarella, huevo, salchicha,
  cebolla) + bruschette + supplì. Masa fina romana, no napolitana.
