address: Via di Monte Testaccio 30 · Testaccio
desc: >-
  Seis generaciones de la familia Mariani, 6 décadas en la lista de los 50 Best
  Restaurants del mundo, una estrella Michelin en 1991. Frente al ex-Matadero,
  con una bodega excavada dentro del Monte dei Cocci (el montículo de ánforas
  romanas del siglo I). El templo canónico del quinto quarto.
plato: >-
  **Plato estrella:** coda alla vaccinara (Gambero Rosso: «Campeón de la
  Tradición 2024») + «padellotto» — mix de vísceras con romero y aceto. Mezze
  maniche cacio e pepe imprescindibles.
footer: Mié–Dom · precio medio €45-65/persona · reserva imprescindible
