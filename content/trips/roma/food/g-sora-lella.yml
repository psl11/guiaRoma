desc: >-
  Trattoria fundada en los años 40 por Elena Fabrizi — la «nonna» de la película
  _Bianco, Rosso e Verdone_. En la Isla Tiberina, literalmente entre las dos
  orillas de Roma. Hoy la llevan sus nietos con la misma cocina de siempre.
plato: >-
  **Plato estrella:** polpettine di nonna Lella en umido + gnocchi
  all'amatriciana. Cerrada los domingos.
