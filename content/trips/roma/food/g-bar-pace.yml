name: Antico Caffè della Pace
address: Via della Pace 3-7 · cerca de Piazza Navona
desc: >-
  El café más fotogénico de Roma: una fachada del XIX cubierta de hiedra, junto
  a la iglesia de Santa Maria della Pace. Abierto desde 1891, es un _salotto_
  donde los agentes inmobiliarios llevan a sus clientes porque, como escribe
  Enric González en _Historias de Roma_: **«en ese entorno se acaba firmando lo
  que sea — lo sé porque yo firmé allí mi contrato para alquilar»**. González
  remata: «Si uno no se enamora de Roma sentado en la terraza del Caffè della
  Pace, más vale que deje de intentarlo.» Café de día, cócteles y aperitivo de
  noche. Se paga el rincón, no el café.
plato: >-
  **Plato estrella:** espresso o un negroni/Aperol en la terraza bajo la hiedra.
  Más por el ambiente que por la comida.
