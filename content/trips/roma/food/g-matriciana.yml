name: La Matriciana dal 1870
address: Via del Viminale 44 · Esquilino (junto al Teatro dell'Opera)
desc: >-
  Una institución desde 1870, junto al Teatro dell'Opera y a un paso del hotel.
  Como dice su nombre, la patria de la amatriciana — **Stanley Tucci** la incluye
  en su recorrido romano. Manteles blancos, servicio clásico, cocina romana de
  libro. Ideal para el almuerzo del lunes o del martes por su cercanía al
  Esquilino.
plato: >-
  **Plato estrella:** bucatini all'amatriciana (el plato de la casa) + carbonara
  + abbacchio. Reserva recomendable, sobre todo si hay función en la Ópera.
