name: Armando al Pantheon
address: Salita de' Crescenzi 31 · Pantheon
desc: >-
  Desde 1961, literalmente a la sombra del Pantheon. La familia Gargioli, tres
  generaciones, sirve cocina romana ortodoxa en un comedor diminuto de paredes
  llenas de dedicatorias. **Stanley Tucci** lo visita en su serie sobre Italia.
  No cede ni a la moda ni al turismo de masas: carta romana pura. Reserva
  imprescindible con semanas de antelación — es minúsculo.
plato: >-
  **Plato estrella:** tonnarelli cacio e pepe, amatriciana, pasta alla gricia y
  abbacchio scottadito. Quinto quarto en carta para los valientes.
footer: Lun–Sáb · €40-55/persona · reserva imprescindible (semanas antes) ·
