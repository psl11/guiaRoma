slug: practica
trip: roma
order: 2
title: Manual de supervivencia romana
eyebrow: Roma practica
intro: >-
  Las pequeñas reglas no escritas que hacen la diferencia entre un turista que
  sufre Roma y un viajero que la disfruta.
sections:
  - heading: Calor de junio
    body: >-
      Temperaturas previstas: **22-32°C**, con sensación térmica más alta sobre las
      13-16h cuando el sol está vertical y el suelo de adoquines irradia calor. La
      estrategia: mañanas intensas (8-13h), descanso en sitios sombreados o
      interiores frescos entre 13-17h, vuelta al ataque al atardecer (17-22h). El
      itinerario ya está pensado así. Bebed agua constantemente y aprovechad los
      _nasoni_.
  - heading: Los nasoni
    body: >-
      Las fuentes públicas de Roma se llaman _nasoni_ (narices grandes) por la
      forma del caño curvado. Distribuyen **agua potable, fresca y gratuita** en
      cientos de puntos de la ciudad. Si tapas el orificio inferior del caño con un
      dedo, sale un chorrito por un agujero pequeño en lo alto del caño — el sistema
      permite beber sin agacharte ni mojarte. Llevad una botella reutilizable y
      rellenadla cada vez que veáis un nasone. Os ahorraréis 5-10€/día por persona
      en agua embotellada. Hay app gratuita "_Waidy Wow_" que mapea todos los nasoni
      de Roma.
  - heading: Cómo pedir un café como romano
    body: |
      - **De pie, en la barra.** Sentado paga doble.
      - **Pagar primero en caja**, recibir scontrino, entregar al barista junto con
      el pedido.
      - **Beberlo de un sorbo o dos.** No es una bebida contemplativa, es una pausa
      rápida.
      - **"Un caffè"** = espresso. Si pides "un café" sin más, te darán espresso por
      defecto.
      - **"Cappuccino"** solo por la mañana, NUNCA después de comer (signo
      inequívoco de turista).
      - Variantes: _caffè doppio_ (doble), _caffè macchiato_ (espresso con poca
      leche), _caffè corretto_ (espresso con grappa), _caffè americano_ (no lo
      pidas).
      - Propina opcional: deja 10-20 céntimos en la barra cuando recoges la
      scontrino.
  - heading: Cómo pedir comida como romano
    body: |
      - **Pasta antes que carne.** Primer plato (_primo_) siempre pasta, risotto o
      sopa. Segundo plato (_secondo_) carne, pescado o verduras.
      - **No pidas pasta como acompañamiento.** La pasta es siempre primer plato.
      - **Pizza solo de noche** (las pizzerías abren después de las 19:00). Al
      mediodía no es pizza, es _pizza al taglio_ en panaderías.
      - **El pan no se come con aceite y balsámico.** Eso es una invención
      americana. El pan italiano se come con la comida o se moja en la salsa.
      - **El "coperto"** (cubierto) es un cargo fijo de €1-3 por persona que cubre
      pan, mantel, agua. Es normal y legal. No es propina.
      - **La propina** es opcional pero apreciada: 5-10% si el servicio fue bueno.
      Dejad efectivo en la mesa, no añadáis a la tarjeta.
      - **Especialidades romanas imprescindibles**: _cacio e pepe_, _amatriciana_,
      _carbonara_, _gricia_, _saltimbocca alla romana_, _abbacchio_ (cordero),
      _carciofi alla romana_ o _alla giudia_, _supplì_, _fiori di zucca fritti_.
  - heading: Transporte
    body: |
      - **Tarjeta Roma 72h**: €18,50. Metro + bus + tranvía ilimitado. Si vais a
      moverse al menos 3 veces al día, sale rentable.
      - **Metro**: solo dos líneas útiles para vosotros. Línea A
      (Termini-Ottaviano, para Vaticano-Spagna-Popolo) y línea B
      (Termini-Colosseo).
      - **Bus**: lentos en hora punta. Mejor metro o caminar.
      - **Taxi**: usad la **app FreeNow** (oficial italiana) o paradas oficiales.
      Los taxis blancos. El precio: bandera inicial €3, después €1,10/km. De Termini
      a centro: €8-12.
      - **Uber**: funciona en Roma pero más caro que taxi oficial.
      - **Bicis y patinetes**: hay Lime y Dott. Útiles para distancias medias, pero
      ojo con los adoquines y el tráfico.
      - **Leonardo Express**: tren directo Termini-Fiumicino. 32 minutos, €14, sale
      cada 15 minutos. No requiere reserva.
  - heading: Iglesias
    body: |
      - **Hombros y rodillas cubiertos**: obligatorio en todas las iglesias.
      Camiseta de manga corta (no de tirantes) y pantalón hasta la rodilla mínimo.
      - **Cubrirse la cabeza**: no es obligatorio para hombres, sí recomendable para
      mujeres en San Pedro (no en otras).
      - **Silencio**: hablad en susurros. Móviles en silencio.
      - **Misa**: si entráis durante una misa, podéis quedaros al fondo en silencio.
      No paseéis por las naves durante el oficio.
      - **Encender frescos**: muchas capillas tienen una caja con luz. Echad €1 o €2
      y se ilumina el cuadro durante 1-2 minutos. La diferencia entre verlo y no
      verlo es enorme.
  - heading: Estafas y precauciones
    body: |
      - **Carteristas**: el metro línea A (especialmente Termini-Spagna), el
      autobús 64 (Termini-Vaticano) y el 40 son los focos clásicos. Bolso delante,
      móvil en bolsillo frontal, cartera nunca en bolsillo trasero.
      - **"Centurions" del Coliseo**: hombres disfrazados de gladiadores que te
      invitan a fotos y luego exigen €20. No interactúes.
      - **"Pulseritas" gitanas**: te atan una pulserita "de regalo" y luego exigen
      pago agresivamente. Si alguien intenta tocarte la muñeca, retírate sin
      contacto.
      - **Restaurantes turísticos cerca del Coliseo / Vaticano / Trevi / Navona**:
      con camarero en la puerta llamando, menú traducido a 8 idiomas con fotos.
      Comida industrial a precios premium. Camina 3 manzanas más allá del monumento.
      - **Petición de "donación" en iglesias**: ignorarla, no es oficial.
      - **Taxis no oficiales en Termini o FCO**: nunca aceptes "venga, te llevo por
      X euros". Solo paradas oficiales con marcador.
  - heading: WiFi y datos
    body: >-
      Roma tiene **WiFi público gratis** en muchas plazas (red "_Roma WiFi Free_")
      aunque no es muy fiable. Mejor llevar datos móviles roaming UE (cualquier
      operador europeo funciona sin recargo). En caso de problemas: registrarse en
      McDonald's, Starbucks o cafés grandes para WiFi.
  - heading: Servicios prácticos
    body: |
      - **Baños públicos**: hay pocos. Estrategia romana: entra en un bar, pide un
      café (€1,30) y usa el baño. Tres baños = €4 y tres espressos. Mejor inversión.
      - **McDonald's del Pantheon** y **McDonald's del Termini**: baños grandes y
      limpios sin consumo obligatorio (de momento).
      - **Farmacias**: cruz verde. Abren rotativamente 24h — siempre hay una abierta
      en cada barrio. Apps: "Farmaciaaperta".
      - **Urgencias médicas**: 112 (general) o 118 (ambulancia). Hospital más
      céntrico: Fatebenefratelli (isla Tiberina).
  - heading: Lecturas y visionados antes del viaje
    body: >-
      Para llegar a Roma con la cabeza preparada y reconocer cosas que veréis sobre
      el terreno.
media:
  - category: libros
    items:
      - >-
        **_Historias de Roma_**, Enric González (2004) — el libro del que sale este
        viaje. Capítulos cortos, ácidos, sobre la Roma cotidiana de un corresponsal
        en los noventa. Si tenéis que leer uno, es este. _(Los pasajes subrayados
        que compartas serán añadidos directamente a las fichas donde correspondan.)_
      - >-
        **_I Segreti di Roma_**, Corrado Augias (2005) — el otro libro de cabecera
        para este viaje. Augias, periodista y escritor romano, explora los secretos
        enterrados de la ciudad: el Bruno de Campo de' Fiori, el mausoleo de
        Adriano, el ghetto y la razzia del 43, la Bocca della Verità como
        alcantarilla, los acueductos. Capítulos autónomos, lectura fácil. Sus
        pasajes ya están enlazados en las fichas de esta guía.
      - >-
        **_Roma_**, Robert Hughes (2011) — biografía cultural de la ciudad en 600
        páginas. Denso pero magistral. Si vais a leerlo entero, empezad ya. Si no,
        leed solo el capítulo sobre el Renacimiento y el Barroco.
      - >-
        **_Memorias de Adriano_**, Marguerite Yourcenar (1951) — el emperador del
        Pantheon en primera persona. Te cambia cómo ves la ciudad. Es el clásico
        moderno sobre la Roma imperial.
      - >-
        **_SPQR_**, Mary Beard (2015) — historia de la antigua Roma escrita por la
        mayor experta viva. Académica pero legible. Buen complemento al Coliseo
        guiado del domingo.
      - >-
        **_El cardenal del Kremlin_**, Andrea Camilleri — para llegar con la cabeza
        puesta en la Italia de las intrigas vaticanas y la corrupción institucional.
  - category: peliculas
    items:
      - >-
        **_La Grande Bellezza_** (Paolo Sorrentino, 2013) — _imprescindible_.
        Vuestro viaje está construido encima de esta película. Vais a pisar
        literalmente las localizaciones (Galleria Sciarra, Fontanone, Giardino
        Aranci, Tempietto, Buco della Serratura). Verla antes (o revisarla)
        multiplica el viaje por dos.
      - >-
        **_La dolce vita_** (Federico Fellini, 1960) — Roma como decadencia
        luminosa. La escena de Anita Ekberg en la Fontana di Trevi. Tres horas que
        merecen la pena, aunque tiene momentos lentos.
      - >-
        **_Roma_** (Federico Fellini, 1972) — pseudo-documental autobiográfico.
        Fellini paseando por la ciudad sin trama, capturando la esencia. Más
        prescindible pero útil como atmósfera.
      - >-
        **_Vacaciones en Roma_** (William Wyler, 1953) — Audrey Hepburn y Gregory
        Peck. Vais a pasar por la Bocca della Verità y por la Scalinata. La película
        tiene casi 75 años pero sigue funcionando.
      - >-
        **_Ladrón de bicicletas_** (Vittorio De Sica, 1948) — la Roma de la
        posguerra. Neorrealismo italiano fundacional. Otra ciudad totalmente
        distinta a la que veréis, pero misma piel.
      - >-
        **_Habemus Papam_** (Nanni Moretti, 2011) — el Vaticano por dentro con humor
        melancólico. Buen aperitivo antes del tour del sábado.
  - category: series
    items:
      - >-
        **_Searching for Italy_** con Stanley Tucci (CNN/Nat Geo, 2021) — el
        episodio de Roma cubre la cocina romana clásica (cacio e pepe, carbonara,
        alcachofas a la giudia, el quinto cuarto en Testaccio). Tucci visita
        Roscioli, Da Felice, el ghetto. _Verlo antes del viaje os va a marcar dónde
        queréis comer_.
      - >-
        **_Rome: Empire Without Limit_** con Mary Beard (BBC, 2016) — 4 episodios.
        La mejor introducción audiovisual a la Roma antigua que existe, hecha por la
        mayor experta. Disponible en YouTube oficial de la BBC. Imprescindible antes
        del Coliseo guiado.
      - >-
        **_Roma_** (HBO/BBC, 2005-2007) — la serie sobre el final de la República
        (Julio César, Marco Antonio, Octavio). Dos temporadas. Si tenéis tiempo, es
        un viaje en sí mismo. La ambientación es minuciosa.
      - >-
        **_Devs_ · ep. "El Vaticano"** en _Civilisations_ con Mary Beard (BBC, 2018)
        — sobre el arte religioso italiano, mucha Roma. Un solo episodio (~60 min)
        que prepara el ojo para San Pedro y la Sixtina.
      - >-
        **_The Two Popes_** (Fernando Meirelles, 2019) — Benedicto XVI y Francisco
        conversando en Castel Gandolfo y la Sixtina. Recreación brutal de los
        espacios vaticanos.
      - >-
        **_Suburra: Sangue su Roma_** (Netflix, 2017-2020) — para ver la Roma
        contemporánea más turbia (mafia, política, Iglesia). Tres temporadas. Solo
        si os atrae el género.
  - category: playlist
    items:
      - >-
        **La playlist de Ludovico Einaudi** — _Le Onde_, _I giorni_, _Una mattina_,
        _Nuvole bianche_. Vais a escucharle en vivo el domingo.
      - >-
        **Banda sonora de _La Grande Bellezza_** — mezcla litúrgica/electrónica
        curada por Sorrentino (Lele Marchitelli + David Lang + Henryk Górecki).
        Spotify la tiene completa.
