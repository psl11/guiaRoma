howTo:
  - >-
    Cada parada tiene su ficha con historia, anécdotas y detalles concretos en los
    que fijarse _in situ_. El buscador encuentra cualquier sitio en segundos. El mapa
    marca los puntos por orden de visita; pulsa un marcador para saltar a la ficha
    correspondiente. Las notas que escribas en cada ficha se guardan en este dispositivo.
    Esta guía funciona _offline_ una vez cargada — descárgala al teléfono antes de salir.
  - >-
    El Vaticano y el Coliseo se visitan con guía humano. Del **Vaticano** sí hay una
    ficha de _preparación_ (qué buscar en los Museos, la Sixtina y San Pedro) entre las
    del sábado. Los demás lugares están en orden cronológico, agrupados por día.
