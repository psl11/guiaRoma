# Viaje FICTICIO de pruebas de FORMA (Fase 10, D-15). No es un viaje real: existe solo para
# comprobar que la guía toma su forma de los datos del viaje. Tiene diez días que repiten día
# de la semana (dos sábados, con slugs con fecha y pastillas propias, D-02/D-03), no tiene
# Arte, Arquitectura, Reservas ni Práctica (sus secciones y pastillas no deben aparecer) y lleva
# su propio chrome: título de pestaña, marca, leyenda del mapa y pie.
#
# Solo DEV: se ve en `pnpm dev` → /trips/forma. NO se prerenderiza ni se enlaza desde ningún
# sitio (nitro.prerender.routes sigue siendo ['/'] y crawlLinks no lo descubre), así que la
# build estática no lo emite. El centinela FORMA-CENTINELA-10A (en howTo) permite comprobar que
# nada de este viaje se cuela en la página publicada.
#
# Fase 11 (ROUTE-05): descomentar la línea siguiente cuando exista el campo `draft` en el
# esquema del viaje. Ese filtro deberá excluir también las filas de forma del sql_dump público
# de la build (CR-01), no solo las rutas de prerender.
# draft: true
