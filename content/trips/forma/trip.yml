# Viaje FICTICIO de pruebas de FORMA (Fase 10, D-15). No es un viaje real: existe solo para
# comprobar que la guía toma su forma de los datos del viaje. Tiene diez días que repiten día
# de la semana (dos sábados, con slugs con fecha y pastillas propias, D-02/D-03), no tiene
# Arte, Arquitectura, Reservas ni Práctica (sus secciones y pastillas no deben aparecer) y lleva
# su propio chrome: título de pestaña, marca, leyenda del mapa y pie.
#
# Borrador (Fase 11, ROUTE-05, D-16): `draft: true` lo deja fuera de la build de producción.
# content.config.ts lo excluye de las 6 colecciones de Nuxt Content, así que no se prerenderiza
# ninguna ruta suya ni viaja ninguna fila suya en los `sql_dump` públicos (CR-01 cerrado). Solo
# en `pnpm dev` se sigue cargando: se ve en /trips/forma, pero nunca se lista en la portada. El
# centinela FORMA-CENTINELA-10A (en howTo) permite comprobar que nada de este viaje llega al
# sitio publicado (tests/data/build-isolation.spec.ts decodifica los dumps).
