sections:
  - heading: Qué es
    body: >-
      El pueblo amurallado en el punto más alto de Procida: el núcleo antiguo de la
      isla, donde la gente se refugiaba de los piratas detrás de los muros. Hoy es un
      laberinto silencioso de callejones, iglesias y casas viejas, con el mar por
      todas partes.
  - heading: Qué mirar
    body: >-
      Asomaos a los miradores: abajo, las casas pastel de la
      [Corricella](#marina-corricella) parecen un belén colgado sobre el agua. Al
      bajar, perdeos por las callejuelas de colores y los huertos de limoneros, con
      sus muros de piedra y el olor a limón en el aire.
  - heading: En vuestro día
    body: >-
      La mañana lenta antes de cambiar de isla: subir sin prisa, mirar, bajar entre
      limoneros y comer tranquilos antes del ferry de la tarde a Ischia.
