family: >-
  El viernes vienen los niños, y es una noche larga y con mucho volumen. Llevad
  protección para los oídos, agua y algo de comer, y acordad antes de entrar un punto de
  encuentro fácil de reconocer por si os separáis entre la gente. La vuelta será
  probablemente pasada la medianoche (la hora de inicio está **⚠ por confirmar**): si
  los niños están cansados, salid un poco antes del final o esperad a
  que se vacíe la salida antes de meteros en la marea de gente.
