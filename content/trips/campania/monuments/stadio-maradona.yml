sections:
  - heading: Qué es
    body: >-
      El gran estadio de Nápoles, en el barrio de Fuorigrotta, al oeste del centro. Es la
      casa del Napoli, lleva el nombre de Maradona desde 2020 y en verano se convierte en
      el escenario de los grandes conciertos de la ciudad. Dos noches de este viaje
      terminan aquí, cantando con miles de napolitanos.
  - heading: Los dos conciertos
    body: >-
      **Ultimo**, el viernes 25 de junio, con los niños. Es la fecha de vuestras
      entradas, aunque el calendario oficial de la gira anunció Nápoles para el jueves
      24: mandan las entradas. La hora de inicio y la apertura de puertas están
      **⚠ por confirmar**.


      **Pinguini Tattici Nucleari**, el domingo 27 de junio, ya los dos solos. Esa fecha
      la publica una sola fuente y está **⚠ por confirmar**, igual que la hora y las
      entradas.
  - heading: Logística práctica
    body: |
      - **Ida**: Metro Línea 2 hasta la estación Napoli Campi Flegrei, en el mismo Piazzale Tecchio. La Cumana para en «Mostra», también cerca. Qué servicios habrá en 2027 está **⚠ por confirmar**.
      - **Vuelta**: para los conciertos de junio de 2025 la Línea 2 puso trenes extra, algunos hasta cerca de la 01:00, y la Cumana solo en algunas noches. Los de 2027 están **⚠ por confirmar**.
      - **Taxis**: esperan en Piazzale Tecchio al acabar, con cola larga cuando sale todo el estadio a la vez.
      - **Con margen**: llegad pronto, con agua, algo de comer y una prenda ligera para la noche.
      - **Obras**: el Ayuntamiento prevé obras de reforma en el estadio a partir de enero de 2027. Cómo afectan a los conciertos del verano está **⚠ por confirmar**.
