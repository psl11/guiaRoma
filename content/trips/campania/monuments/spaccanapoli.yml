sections:
  - heading: Qué es
    body: >-
      La calle larga y recta que parte en dos el centro histórico de Nápoles, como
      un tajo: de ahí su nombre, «la que parte Nápoles». Sigue el trazado de una vía
      de la ciudad griega y, desde lo alto del Vomero, se ve cortar el casco viejo
      de punta a punta.
  - heading: Qué mirar
    body: >-
      A primera hora, con las persianas aún bajadas, se oye la ciudad despertar:
      el olor a café que sale de los bares, las campanas de las iglesias, las
      fachadas de palacios desconchados y los talleres de belenes esperando a
      abrir. Levantad la vista: ropa tendida de balcón a balcón y, al fondo, la
      silueta de Castel Sant'Elmo.
  - heading: En vuestro día
    body: >-
      El domingo empieza aquí, con la carrera popular que lleva su nombre. Podéis
      correrla o mirarla desde la acera con un café en la mano; las dos maneras
      valen. Después, ducha y a caminar hacia el puerto, que espera el ferry a Procida.
