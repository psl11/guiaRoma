sections:
  - heading: Qué es
    body: >-
      Un lago redondo dentro de un cráter apagado de los Campos Flégreos, junto a
      Pozzuoli. Para los antiguos, aquí estaba la puerta del inframundo: por estas
      orillas baja Eneas a ver a los muertos en la Eneida.
  - heading: Qué mirar
    body: >-
      El agua quieta dentro del anillo verde del cráter, los viñedos que bajan hasta
      la orilla y el silencio, que sorprende a tan pocos kilómetros de Nápoles.
  - heading: En vuestro día
    body: >-
      La primera parada de la Opción 2: la vuelta al lago a pie, un sendero llano de
      unos 2,8 km que se hace en unos 45 minutos, entre viñas y sin prisa. Si os
      apetece, en las bodegas de la orilla se puede comprar vino, en la que os
      llame sobre el terreno.
