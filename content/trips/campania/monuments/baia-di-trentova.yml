  alt: La bahía de Trentova, junto a Agropoli, con el agua clara y la costa verde
sections:
  - heading: Qué es
    body: >-
      Una bahía abierta junto a Agropoli, en la costa norte del Cilento, al sur de
      Salerno. Agua clara, costa verde y una orilla a la que vienen a bañarse las
      familias del lugar, lejos de las playas más conocidas.
  - heading: Qué mirar
    body: >-
      El color del agua, que cambia de verde a azul con la profundidad; la línea de
      la costa del Cilento, con la vegetación que baja hasta el mar; y, al norte, el
      promontorio de Agropoli.
  - heading: En vuestro día
    body: >-
      La tarde de la Opción A, después de los pueblos de los ceramistas: toalla,
      baño y nada más, compartiendo orilla con la gente de la zona hasta que baje el
      sol.
