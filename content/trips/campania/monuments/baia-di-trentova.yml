mapsQuery: Spiaggia di Trentova Agropoli
family: >-
  Orilla de guijarros y arena: escarpines para los niños y algo de sombra propia por
  si no hay sombrillas. Llevad agua de sobra y bañaos en las horas de menos sol,
  siempre con un adulto al lado. Qué servicios hay en la playa (sombra, bar,
  socorrista) está **⚠ por confirmar**.
