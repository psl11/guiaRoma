sections:
  - heading: Qué es
    body: >-
      Un largo pasillo excavado en la toba de la acrópolis de Cuma, una de las
      colonias griegas más antiguas de Italia. La tradición lo identifica con la cueva donde
      la Sibila daba sus oráculos, la misma a la que acude Eneas antes de bajar al
      inframundo.
  - heading: Qué mirar
    body: >-
      El corredor de sección trapezoidal, con la luz que entra a franjas por las
      aberturas del lado del mar; la sala del fondo, donde se imagina a la Sibila; y,
      subiendo por la acrópolis, los restos de los templos y la vista sobre la costa.
  - heading: En vuestro día
    body: >-
      La segunda parada de la Opción 2, después del lago. La visita va con reserva y
      con entrada por turnos, así que llevad la hora apuntada y llegad con margen.
      Dentro del Antro solo caben 25 personas a la vez: si hay que esperar, la
      acrópolis, con su sombra de árboles, es buen sitio.
