sections:
  - heading: Qué es
    body: >-
      La fortaleza que vigila Salerno desde lo alto de la colina, con el nombre de
      Arechi, el príncipe lombardo que hizo de la ciudad su capital. Murallas y
      torres de piedra sobre el casco antiguo, con todo el golfo a los pies.
  - heading: Qué mirar
    body: >-
      La vista desde las murallas: los tejados del centro storico, el puerto, el
      paseo marítimo y la costa que se pierde hacia Amalfi por un lado y hacia el
      sur por el otro.
  - heading: En vuestro día
    body: >-
      La subida de media mañana, en coche, después de la catedral: desde arriba se
      entiende la ciudad entera antes de salir hacia la costa o hacia el río.
