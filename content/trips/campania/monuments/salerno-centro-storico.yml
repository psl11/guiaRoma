sections:
  - heading: Qué es
    body: >-
      El casco medieval de Salerno, un laberinto de callejuelas estrechas, arcos y
      patios que se ordena alrededor de la Via dei Mercanti, la vieja calle de los
      comercios. Una ciudad de verdad, con vecinos, tiendas de barrio y tabernas,
      lejos del lujo y de los precios de la costa.
  - heading: Qué mirar
    body: >-
      Los arcos que cruzan las calles de lado a lado, los portales de piedra de los
      palacios antiguos, las ropas tendidas entre balcones y las placitas que se
      llenan de gente al caer la tarde, cuando la ciudad sale a pasear.
  - heading: En vuestro día
    body: >-
      La primera noche en Salerno, ya con Arantxa y con el coche aparcado. Un paseo
      lento por la Via dei Mercanti, sin plan ni reloj, y después la cena en una
      taberna del barrio, [Hostaria Il Brigante](#g-4-il-brigante).
