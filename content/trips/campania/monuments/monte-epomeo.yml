family: >-
  Salid temprano y con agua de sobra: los tramos a la sombra de los castaños son el
  mejor sitio para las paradas de los niños. Si se cansan, no pasa nada por quedarse
  en el bosque y no llegar a la cima. Evitad con ellos la variante de Pietra Martone
  y Pietra Mosca, de unas 6 horas y con tramos expuestos.
