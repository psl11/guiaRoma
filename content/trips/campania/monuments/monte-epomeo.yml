sections:
  - heading: Qué es
    body: >-
      El techo de Isquia: un antiguo volcán de toba verde, de casi 800 metros, que
      domina la isla entera. No es un cono de postal, sino una montaña de roca
      verdosa, bosque de castaños y viñas en terrazas. Subirlo a pie, sin prisa y
      con los niños, es la mejor manera de entender de qué está hecha la isla.
  - heading: La subida
    body: >-
      El sendero clásico es el **CAI 501**, que sale de Fontana, en el municipio de
      Serrara Fontana: unos **3 km** y entre **1 y 1,5 h** de subida. Buena parte del
      camino va a la sombra de robles y castaños, así que en junio se agradece
      salir temprano y guardar el tramo abierto para cuando aún no aprieta el sol.
  - heading: En la cima
    body: >-
      Arriba os esperan la cruz de la cima y el Eremo di San Nicola, la ermita del
      monte, con un restaurante cerca. Sentaos a mirar: desde aquí se abarca toda
      la isla y, con el día claro, el golfo entero. Se baja por el mismo camino
      hasta Fontana.
