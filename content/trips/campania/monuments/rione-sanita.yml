sections:
  - heading: Qué es
    body: >-
      El barrio popular que se extiende al pie de la colina de Capodimonte, fuera de las
      viejas murallas. Un Nápoles de barrio de verdad, con ropa tendida entre balcones,
      altares en las esquinas y vecinos que charlan a la puerta de casa, y a la vez el
      barrio de los palacios barrocos de escaleras abiertas.
  - heading: Qué mirar
    body: >-
      Las escaleras de doble rampa del Palazzo dello Spagnuolo y del Palazzo Sanfelice,
      abiertas al patio como el decorado de un teatro; las calles estrechas y su ruido
      de motos y de voces; la cúpula de Santa Maria della Sanità. Bajo las calles hay
      catacumbas, pero esta tarde es de barrio, no de visitas.
  - heading: En vuestro día
    body: >-
      La tarde «de barrio» del viernes, con el coche ya aparcado: paseo sin rumbo por la
      Sanità, una mirada a los patios de los palacios y una cena temprana en
      [Da Concettina ai Tre Santi](#gastronomia) antes de ir al concierto.
