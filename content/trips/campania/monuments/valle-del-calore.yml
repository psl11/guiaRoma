mapsQuery: Gole del Calore Felitto
family: >-
  Las rocas del río resbalan y el agua baja fría incluso en junio: calzado de agua
  para los niños y nadie en el río sin un adulto al lado. El sendero tiene tramos
  más empinados, así que con los pequeños mejor quedarse en la zona de la poza.
  Las normas de baño y la calidad del agua están **⚠ por confirmar**.
