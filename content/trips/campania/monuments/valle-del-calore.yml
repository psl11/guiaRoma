sections:
  - heading: Qué es
    body: >-
      Las gargantas del río Calore junto a Felitto, en el interior del Cilento: el
      agua corre entre paredes de roca y bosque de ribera. Junto al río hay una zona
      de picnic, un restaurante y una poza natural que forma una antigua presa,
      donde la gente del lugar viene a bañarse en verano.
  - heading: Qué mirar
    body: >-
      El color verde del agua en la poza, las paredes de roca de la garganta y, al
      final del sendero que sale de Felitto, el puente medieval de un solo arco
      sobre el río.
  - heading: En vuestro día
    body: >-
      El día de la Opción B: agua dulce, sombra de árboles y un sendero junto al
      río. La ruta completa del CAI, de Felitto a las gargantas y el puente, ronda
      las 4 h con 350 m de desnivel; con niños, basta un tramo corto y la poza.
facts:
