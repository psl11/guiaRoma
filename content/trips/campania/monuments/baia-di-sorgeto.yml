sections:
  - heading: Qué es
    body: >-
      Una cala pequeña de cantos y rocas al pie del acantilado, en el sur de
      Ischia, donde el agua termal del volcán brota del fondo y se mezcla con el mar
      en pozas naturales. Según la poza, el agua va de templada a muy caliente. En
      julio y agosto se llena; en junio todavía se respira.
  - heading: Cómo bajar
    body: >-
      A pie desde Panza, una aldea de Forio, por una larga bajada de peldaños hasta
      la cala. De día también se puede llegar por mar, en taxi-barca desde
      Sant'Angelo. La vuelta es cuesta arriba: guardad fuerzas para ella.
  - heading: De noche
    body: >-
      Flotar en el agua caliente mirando las estrellas es la razón de venir aquí al
      anochecer, y lo que convierte el martes en un recuerdo de familia. Pero lo que
      más importa con niños no está publicado en ninguna parte: si la bajada tiene
      luz, cómo está el mar o si quedan barcas por la tarde **⚠ por confirmar**.
      Decididlo allí, con lo que veáis.
