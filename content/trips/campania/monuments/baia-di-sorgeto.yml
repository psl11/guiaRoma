mapsQuery: Baia di Sorgeto Forio Ischia
family: >-
  Los escalones de la bajada son muchos y, con niños pequeños, conviene hacerlos de
  día la primera vez y sin prisa. En algunas pozas el agua sale tan caliente que
  quema: comprobadla siempre con la mano antes de que se metan. Si bajáis de noche,
  llevad linterna y calzado cerrado para las rocas; el acceso de noche, la
  iluminación, el estado del mar y las barcas de la tarde están **⚠ por confirmar**.
