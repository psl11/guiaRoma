sections:
  - heading: Qué es
    body: >-
      Una cala de cantos rodados al pie de un acantilado del sur de Isquia, donde
      el agua caliente del volcán brota entre las rocas y se mezcla con el mar en
      pozas naturales. De noche, bañarse aquí mirando las estrellas es un rito.
facts:
  - label: Acceso
    value: 'Libre · unos 230 escalones desde Panza'
mapsQuery: Baia di Sorgeto Ischia
family: >-
  La bajada son unos 230 escalones sin barandilla en algunos tramos: con niños pequeños,
  mejor de día y sin prisa. En algunas pozas el agua sale muy caliente, así que comprobadla
  antes con la mano. Si vais de noche, llevad linterna y calzado cerrado para las rocas.
