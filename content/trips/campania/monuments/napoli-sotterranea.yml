family: >-
  Se baja por una escalera larga, así que no se puede entrar con carrito, y algunos
  pasadizos son muy estrechos. Para los niños es una aventura, pero conviene que vayan
  de la mano de un adulto y que no les agobien los sitios cerrados. Las tarifas para
  niños no coinciden entre fuentes y están **⚠ por confirmar**.
