sections:
  - heading: Qué es
    body: >-
      La ciudad que hay debajo de la ciudad: galerías, cisternas y pasadizos excavados
      en la toba volcánica, muy por debajo de las calles del centro histórico. Sirvieron
      de cantera, de depósito de agua y, durante la Segunda Guerra Mundial, de refugio
      contra los bombardeos. Una visita a escala humana, sin grandes salas, que se hace
      siempre con guía.
  - heading: Qué mirar
    body: >-
      Las paredes de toba, blanda y amarillenta, con las marcas de las herramientas; los
      pozos por donde se subía el agua a las casas; los pasadizos tan estrechos que hay
      que pasar de lado; y, en los refugios, los rastros que dejaron quienes esperaron
      allí abajo a que pasaran las bombas.
  - heading: En vuestro día
    body: >-
      La mañana del domingo, ya los dos solos después de despedir a Arantxa y a los
      niños en el aeropuerto. Entre hora y media y dos horas bajo tierra, al fresco,
      antes de una tarde tranquila. La visita se reserva con antelación: horario y
      precio **⚠ por confirmar**.
