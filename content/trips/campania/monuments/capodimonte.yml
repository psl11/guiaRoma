sections:
  - heading: Qué es
    body: >-
      El gran bosque real en lo alto de la colina de Capodimonte, por encima del Rione
      Sanità: avenidas largas bajo los árboles, praderas y rincones de sombra alrededor
      del palacio de los Borbones, que hoy es museo. Un parque donde los napolitanos
      vienen a pasear, a correr o a no hacer nada.
  - heading: Qué mirar
    body: >-
      Las avenidas rectas que se abren desde la entrada, los árboles altos que dan
      sombra hasta en las horas de más calor y, desde los bordes de la colina, la ciudad
      y el golfo a vuestros pies.
  - heading: En vuestro día
    body: >-
      Una tarde de domingo a la sombra, sin plan: un banco, el libro comprado por la
      mañana en una librería del centro y un paseo lento antes del último concierto. El
      horario de apertura del parque está **⚠ por confirmar**.
