sections:
  - heading: Qué es
    body: >-
      Dos aldeas tranquilas de Vietri sul Mare, el pueblo de la cerámica, colgadas
      sobre la costa de Amalfi a pocos kilómetros de Salerno. Raito y Albori son
      pueblos de casas apiñadas, cúpulas de azulejo y talleres de ceramistas, lejos
      del bullicio de la costa más famosa.
  - heading: Qué mirar
    body: >-
      En Raito, el Museo Provinciale della Ceramica, en Villa Guariglia, con sus
      jardines sobre el mar. En Albori, que está entre «I Borghi più belli
      d'Italia», las callejuelas en escalera, las fachadas de colores y las vistas
      del golfo de Salerno desde arriba.
  - heading: En vuestro día
    body: >-
      La mañana de la Opción A: un paseo lento entre talleres y miradores, sin
      prisa, antes de bajar en coche hacia el sur a buscar una cala para la tarde.
