mapsQuery: Spiaggia di Miliscola Bacoli
family: >-
  La arena volcánica quema al mediodía: escarpines o chanclas para los niños y algo
  de sombra propia por si no hay sombrillas. Llevad agua de sobra y bañaos en las
  horas de menos sol, siempre con un adulto al lado. Qué servicios hay en la playa
  (sombra, bar, socorrista) está **⚠ por confirmar**.
