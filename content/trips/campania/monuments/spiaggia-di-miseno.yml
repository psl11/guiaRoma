  alt: La playa de Miliscola entre el lago Miseno y el mar, con el cabo Miseno al fondo
sections:
  - heading: Qué es
    body: >-
      La playa de arena volcánica de Miliscola, en Bacoli: una franja larga entre el
      lago Miseno y el mar, con el promontorio del cabo Miseno cerrando el horizonte.
      Es la playa de las familias napolitanas, no la de los folletos.
  - heading: Qué mirar
    body: >-
      La arena oscura, de origen volcánico; el lago a un lado y el mar al otro; y la
      silueta del cabo Miseno, que se pone dorado a última hora de la tarde.
  - heading: En vuestro día
    body: >-
      El final de la Opción 2: toalla, baño y la tarde compartiendo orilla con las
      familias del lugar, hasta que toque volver hacia Capodichino a devolver el
      coche.
