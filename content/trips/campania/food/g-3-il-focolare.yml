name: Trattoria Il Focolare
address: Via Cretajo al Crocefisso 3 · Fiaiano, Barano d'Ischia
desc: >-
  La otra Ischia, la de dentro, entre bosques y lejos de la playa. Aquí se
  cocina el coniglio all'ischitana en olla de barro, el plato campesino de la
  isla, y solo por reserva: hay que pedirlo con antelación. Desde Forio se sube
  en taxi. En 2024 se publicó que cerraba los miércoles; el día de cierre y el
  horario están **⚠ por confirmar**, así que conviene llamar antes de subir.
plato: >-
  **Plato estrella:** coniglio all'ischitana, el conejo guisado lentamente en
  su olla de barro, con tomate y hierbas, y la salsa para mojar pan o vestir
  la pasta.
footer: Lunes 21, en Ischia · solo con reserva · horario a confirmar
