name: Da Concettina ai Tre Santi
address: Via Arena della Sanità 7 bis · Rione Sanità
desc: >-
  Abierta desde 1951 en pleno Rione Sanità y ya en su cuarta generación: hoy
  la lleva Ciro Oliva, y la citan la Guía Michelin y Dissapore sin que haya
  dejado de ser la pizzería del barrio. Llegáis en metro (Cavour o Museo) y
  bajáis andando entre ropa tendida y altares de esquina. Es la parada del
  viernes por la tarde, antes del concierto: mesa larga, sin prisa, con los
  niños mirando el horno. Horario y precios **⚠ por confirmar**.
plato: >-
  **Plato estrella:** la pizza napolitana de siempre, de borde alto y blando,
  para compartir al centro de la mesa. Una margherita y una marinara bastan
  para empezar.
footer: Viernes 25, antes del concierto · horario y precio a confirmar
