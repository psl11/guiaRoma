desc: >-
  Una taberna pequeña en las callejuelas del centro storico de Salerno, que
  aparece en varias guías y directorios. Cocina de casa, sin ceremonia, para la
  cena del miércoles después de llegar a la ciudad con el coche. Se ha
  publicado que cierra los lunes; el día de cierre y el horario están
  **⚠ por confirmar**.
plato: >-
  **Plato estrella:** pasta de la casa con salsa de tomate de la zona, como se
  hace en las cocinas de Salerno.
