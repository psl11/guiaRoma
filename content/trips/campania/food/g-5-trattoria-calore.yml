name: Una trattoria de monte junto al Calore
address: Felitto · Gole del Calore · a elegir sobre el terreno
desc: >-
  Al llegar a Felitto, antes de la tarde en las gargantas del Calore, la comida
  es en una trattoria familiar del pueblo o de sus alrededores, de las de mantel de
  cuadros y abuela en la cocina. No llevéis un nombre: preguntad en el pueblo y
  elegid sobre el terreno. Felitto celebra en verano su sagra de los fusilli;
  las fechas de este año están **⚠ por confirmar**.
plato: >-
  **Plato estrella:** fusilli felittesi, la pasta del pueblo, enrollada a mano
  con una varilla, con ragú de carne o salsa de tomate.
