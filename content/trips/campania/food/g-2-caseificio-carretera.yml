name: Un caseificio de carretera
address: Camino de Salerno al Vesubio · a elegir sobre el terreno
desc: >-
  El viernes, en el coche de Salerno hacia el Vesubio, la carretera pasa junto
  a caseifici pequeños, de los que venden la mozzarella del día en un mostrador
  sencillo. Parad en uno, el que veáis con gente del lugar comprando, y
  llevaos una bolsa con su suero para comerla a media mañana. No buscáis un
  restaurante, sino un alto en el camino que sabe a leche fresca.
plato: >-
  **Plato estrella:** mozzarella di bufala del día y, si la tienen, una
  treccia para pellizcar entre todos en el coche.
