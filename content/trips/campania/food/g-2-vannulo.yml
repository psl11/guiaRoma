name: Tenuta Vannulo
address: Via Galileo Galilei 101 · Contrada Vannulo, Capaccio Scalo
desc: >-
  En la llanura de Paestum, de camino al Calore si el jueves elegís la opción
  B, está la granja donde la mozzarella se hace solo con la leche de sus
  propias búfalas. Se puede visitar: los niños ven a los animales de cerca y
  entienden de dónde sale lo que luego se comen. Comprad la mozzarella allí
  mismo y llevadla para la merienda junto al río. Horario de venta y de visitas
  **⚠ por confirmar**.
plato: >-
  **Plato estrella:** una mozzarella di bufala recién hecha, todavía tibia,
  comida tal cual, sin pan ni aceite que la tapen.
footer: Jueves 24, opción B · horario de venta y visitas a confirmar
