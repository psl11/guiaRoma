name: Una pizzería de barrio en el Vomero
address: Vomero · a elegir sobre el terreno
desc: >-
  La primera noche, con el cansancio del viaje encima, la mejor cena es la que
  está a la vuelta de la esquina: una pizzería de barrio en el Vomero, de esas
  donde el pizzaiolo os trata como a vecinos y los niños se quedan mirando
  cómo estira la masa. No hace falta llevar un nombre apuntado; elegid la que
  tenga las mesas llenas de familias del barrio. Si queréis una clásica, está
  Pizzeria Gorizia 1916 (Via Gian Lorenzo Bernini 29/31), pero se publicó que
  había cerrado por obras y su reapertura está **⚠ por confirmar**.
plato: >-
  **Plato estrella:** la margherita, y una marinara para quien no quiera queso.
  Masa blanda y borde hinchado; si os la lleváis para el camino, doblada en
  cuatro, «a portafoglio», como se come por la calle en Nápoles.
