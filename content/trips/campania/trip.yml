# Esqueleto de CAMPANIA (Fase 12, D-15). Es el segundo viaje real de la guía, pero en esta
# fase solo existe para probar las formas nuevas de viaje de punta a punta: alternativas dentro
# de un día (`choice`), alojamiento por noche, transportes y fichas de naturaleza, rutas en coche
# y notas familiares. Los textos son provisionales, en español y con nombres reales; la Fase 13
# reescribe el contenido completo.
#
# Borrador (D-16): `draft: true` lo deja fuera de la build de producción (content.config.ts lo
# excluye de las 6 colecciones: ni ruta prerenderizada ni filas en los `sql_dump` públicos). En
# `pnpm dev` se carga y se ve en /trips/campania, pero nunca se lista en la portada. La marca de
# control de howTo (centinela de la Fase 12) permite comprobar que nada de este viaje llega al
# sitio publicado.
