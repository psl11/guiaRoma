  Diez días de junio entre Nápoles, Procida, Ischia, Salerno y el Cilento, a ritmo
  lento y en familia: islas, volcanes, pozas termales y dos conciertos en el Maradona.
sections:
  gastronomia:
    eyebrow: Campania · gastronomía
    intro: >-
      En Campania se come en la calle y en familia. La pizza de barrio de Nápoles, la
      mozzarella di bufala recién hecha, las cocinas de las islas con su pescado y sus
      limones, las tabernas de Salerno y las trattorias de monte del Cilento: los
      sitios de abajo cuadran con las zonas que vais a recorrer.
