howTo:
  - >-
    Cada parada tiene su ficha con su historia, lo que merece la pena mirar y, donde
    importa, una nota «Con niños». El buscador encuentra cualquier sitio en segundos.
    El mapa marca los puntos por orden de visita; pulsad un marcador para saltar a su
    ficha. Las notas que escribáis en cada ficha se guardan en este dispositivo.
  - >-
    La guía funciona _offline_ una vez cargada: abridla con conexión antes de salir.
    Sin red, las fotos se sustituyen por un dibujo del lugar. Lo que aún no está
    publicado en noviembre de 2026 (los horarios de los ferris del verano de 2027, las
    horas de los conciertos, las normas de las islas para ese año) lleva la marca
    **⚠ por confirmar**: revisadlo antes del viaje.
  - >-
    El jueves 24 y el sábado 26 muestran sus opciones apiladas, una debajo de otra:
    elegid una según las ganas, el calor y el cansancio de los niños.
