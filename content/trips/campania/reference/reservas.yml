table:
  - name: Alojamiento en Nápoles · noche del 19
    badge: semanas antes
    badgeKind: urgent
    desc: >-
      La primera noche, en el Vomero, cerca del metro o de un funicular para bajar
      al centro. Zona y alojamiento **⚠ por confirmar**.
  - name: Alojamiento en Procida · noche del 20
    badge: semanas antes
    badgeKind: urgent
    desc: >-
      Una sola noche en la isla, mejor cerca del puerto de Marina Grande o de la
      Corricella para ir andando con las mochilas. Alojamiento **⚠ por confirmar**.
  - name: Alojamiento en Ischia · noches del 21 y el 22
    badge: semanas antes
    badgeKind: urgent
    desc: >-
      Dos noches en Forio o cerca de la bahía de Sorgeto, la base para el Epomeo y
      los baños termales. Alojamiento **⚠ por confirmar**.
  - name: Alojamiento en Salerno · noches del 23 y el 24
    badge: semanas antes
    badgeKind: urgent
    desc: >-
      Dos noches con el coche: buscad un alojamiento con aparcamiento o un parking
      cercano fuera de la ZTL del centro storico. Alojamiento **⚠ por confirmar**.
  - name: Alojamiento en Nápoles · noches del 25 al 27
    badge: semanas antes
    badgeKind: urgent
    desc: >-
      Las tres últimas noches en Nápoles. ¿La misma base que la primera noche, en el
      Vomero, u otra zona? **⚠ por confirmar**. La noche del 25 el coche duerme en
      un garaje o un parking cerca de la base.
  - name: Ferry Nápoles → Procida · domingo 20
    badge: días antes
    badgeKind: rec
    desc: >-
      Traghetto de **Caremar** desde Porta di Massa, en torno a las 12:15 o las
      13:30 **⚠ por confirmar** (los horarios del verano de 2027 aún no están
      publicados). Billetes en la web de Caremar o en la app MyCaremar.
  - name: Ferry Procida → Ischia · lunes 21
    badge: días antes
    badgeKind: rec
    desc: >-
      Un salto corto: unos 30 min en traghetto o 15-20 min en aliscafo. Hora de
      salida **⚠ por confirmar**; billetes en línea o en la taquilla del puerto.
  - name: Ferry Ischia → Nápoles · miércoles 23
    badge: días antes
    badgeKind: rec
    desc: >-
      Vuelta a Nápoles con tiempo de sobra para estar a las 16:00 en Capodichino.
      Compañía, puerto de llegada y hora **⚠ por confirmar**.
  - name: Coche de alquiler · del miércoles 23 al sábado 26
    badge: reservar ya
    badgeKind: urgent
    desc: >-
      Recogida el **miércoles 23 a las 16:00** en el aeropuerto de Capodichino,
      cuando llega Arantxa. Devolución el **sábado 26**, prevista también en
      Capodichino. Compañía, punto y hora de devolución **⚠ por confirmar**. Al
      devolverlo, pedid un justificante de devolución firmado. El coche no cruza a
      las islas.
