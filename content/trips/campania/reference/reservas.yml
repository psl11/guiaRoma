intro: >-
  Todo lo que tenéis que reservar para el viaje, en un solo sitio: los vuelos,
  las entradas de los conciertos y, más abajo, los alojamientos, los ferris, el
  coche y las visitas con cupo, con cuánta antelación conviene cerrarlos. Lo
  marcado con **⚠ por confirmar** todavía tenéis que comprobarlo vosotros.
# Encabezados propios de Campania (Fase 12.1, D-16/D-23): el primer bloque son los vuelos, el
# segundo las entradas confirmadas y la tabla, lo que queda por reservar. Sin ellos se verían los
# textos de Roma (la regla `reservas-headings` de la puerta lo impide).
