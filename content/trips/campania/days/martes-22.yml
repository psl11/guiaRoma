roman: IV
eyebrow: 'martes · 22 de junio'
title: El volcán de día, el mar caliente de noche
subtitle: Subida entre castaños al Monte Epomeo · siesta a la sombra · de noche, pozas termales en la Baia di Sorgeto.
# Base de la noche (D-06): slug de una entrada de `stays` en trip.yml → «Dormís en Ischia».
stay: ischia
# Dos paradas con ficha: en transporte público Google Maps sí dibuja la ruta (WR-01, D-08).
route:
  mode: transit
stats:
  - variant: walk
    text: '**~7 km** a pie · sendero del Epomeo y escalones de Sorgeto'
  - variant: bus
    text: '**Bus EAV** · Forio ↔ Fontana y, de noche, hasta Panza'
light:
  title: 🦶 Versión ligera · martes
  items:
    - kind: see
      text: >-
        **Imprescindibles:** el primer tramo del sendero entre castaños y, al caer
        la tarde, las pozas de [Sorgeto](#baia-di-sorgeto).
    - kind: skip
      text: >-
        **Saltar hoy:** la cima. Quedaos en el bosque de castaños, a la sombra, y
        bajad sin prisa a comer.
    - kind: care
      text: >-
        **Ojo:** el calor de junio en los tramos abiertos de la subida y el agua
        termal, que en algunas pozas sale muy caliente.
    - kind: rest
      text: >-
        **Descanso:** la comida larga en la taberna y la siesta a la sombra antes
        de la noche en el mar.
